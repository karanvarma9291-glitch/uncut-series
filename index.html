<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Uncut Series | OTT & Web Series</title>
<meta name="description" content="Uncut Series - Web Series, OTT entertainment, models and latest shows.">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#080808;
color:#fff;
}

/* AGE WARNING */
#ageGate{
position:fixed;
inset:0;
z-index:99999;
background:linear-gradient(135deg,#050505,#250000,#080808);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.ageBox{
width:100%;
max-width:450px;
background:#151515;
border:1px solid #444;
border-radius:16px;
padding:35px 25px;
text-align:center;
box-shadow:0 20px 80px #000;
}

.ageLogo{
font-size:32px;
font-weight:900;
color:#e50914;
margin-bottom:20px;
}

.age18{
display:inline-block;
background:#e50914;
padding:12px 18px;
border-radius:8px;
font-size:24px;
font-weight:900;
margin-bottom:20px;
}

.ageBox h1{
font-size:25px;
margin-bottom:15px;
}

.ageBox p{
color:#bbb;
line-height:1.6;
font-size:14px;
margin-bottom:25px;
}

.ageButtons{
display:flex;
gap:12px;
justify-content:center;
}

.ageBtn{
border:0;
padding:13px 25px;
border-radius:7px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.enter{
background:#e50914;
color:#fff;
}

.exit{
background:#333;
color:#ddd;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:1000;
background:#101010;
border-bottom:1px solid #292929;
}

.nav{
max-width:1250px;
margin:auto;
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.logo{
font-size:25px;
font-weight:900;
color:#e50914;
white-space:nowrap;
}

.menu{
display:flex;
gap:18px;
list-style:none;
flex-wrap:wrap;
}

.menu a{
color:#fff;
text-decoration:none;
font-size:15px;
font-weight:bold;
}

.menu a:hover{color:#e50914}

/* HERO */
.hero{
min-height:440px;
display:flex;
align-items:center;
background:
linear-gradient(90deg,#050505 10%,rgba(5,5,5,.8),rgba(5,5,5,.2)),
radial-gradient(circle at 75% 40%,#7b1111,#170505 45%,#050505);
}

.heroContent{
max-width:1250px;
width:100%;
margin:auto;
padding:60px 20px;
}

.badge{
display:inline-block;
background:#e50914;
padding:8px 13px;
border-radius:6px;
font-size:12px;
font-weight:900;
margin-bottom:17px;
}

.hero h1{
font-size:clamp(42px,8vw,78px);
margin-bottom:15px;
}

.hero p{
max-width:620px;
color:#ccc;
line-height:1.7;
font-size:16px;
margin-bottom:25px;
}

.btn{
display:inline-block;
background:#e50914;
color:white;
text-decoration:none;
padding:14px 23px;
border-radius:7px;
font-weight:bold;
}

/* SECTIONS */
section{
max-width:1250px;
margin:auto;
padding:42px 18px;
}

.title{
font-size:28px;
margin-bottom:22px;
}

/* OTT */
.ottGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:12px;
}

.ott{
background:#171717;
border:1px solid #303030;
padding:20px 10px;
border-radius:9px;
text-align:center;
font-weight:bold;
cursor:pointer;
}

.ott:hover{
border-color:#e50914;
transform:translateY(-3px);
}

/* VIDEO */
.videoGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:18px;
}

.card{
background:#151515;
border:1px solid #292929;
border-radius:9px;
overflow:hidden;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
border-color:#555;
}

.thumbnail{
height:140px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#451010,#111);
font-size:42px;
}

.cardBody{
padding:14px;
}

.cardBody h3{
font-size:17px;
margin-bottom:7px;
}

.cardBody p{
font-size:13px;
color:#999;
}

/* TAGS */
.tags{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.tag{
background:#181818;
border:1px solid #333;
padding:9px 15px;
border-radius:20px;
color:#ddd;
}

/* ADS PLACEHOLDER */
.adBox{
max-width:970px;
min-height:100px;
margin:10px auto;
display:flex;
align-items:center;
justify-content:center;
border:1px dashed #333;
background:#101010;
color:#666;
font-size:13px;
}

/* FOOTER */
footer{
background:#111;
border-top:1px solid #292929;
margin-top:20px;
}

.footer{
max-width:1250px;
margin:auto;
padding:40px 18px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:30px;
}

.footer h3{margin-bottom:14px}

.footer p{
color:#999;
line-height:1.6;
}

.footer a{
display:block;
color:#aaa;
text-decoration:none;
margin:9px 0;
}

.footer a:hover{color:#fff}

.copy{
text-align:center;
color:#777;
padding:20px;
border-top:1px solid #222;
font-size:13px;
}

/* MOBILE */
@media(max-width:700px){

.nav{
flex-direction:column;
}

.menu{
justify-content:center;
gap:12px;
}

.hero{
min-height:390px;
}

.videoGrid{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.thumbnail{
height:105px;
}

.cardBody{
padding:10px;
}

.cardBody h3{
font-size:14px;
}
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate">

<div class="ageBox">

<div class="ageLogo">UNCUT SERIES</div>

<div class="age18">18+</div>

<h1>Age Verification</h1>

<p>
यह वेबसाइट केवल 18 वर्ष या उससे अधिक आयु के दर्शकों के लिए है।
आगे बढ़ने से पहले कृपया अपनी आयु की पुष्टि करें।
</p>

<div class="ageButtons">
<button class="ageBtn enter" onclick="enterSite()">
I AM 18+
</button>

<button class="ageBtn exit" onclick="leaveSite()">
EXIT
</button>
</div>

</div>
</div>


<!-- HEADER -->
<header>

<nav class="nav">

<div class="logo">UNCUT SERIES</div>

<ul class="menu">

<li><a href="#home">Home</a></li>
<li><a href="#series">Series</a></li>
<li><a href="#models">Models</a></li>
<li><a href="#ott">OTT</a></li>
<li><a href="#tags">Tags</a></li>

</ul>

</nav>

</header>
